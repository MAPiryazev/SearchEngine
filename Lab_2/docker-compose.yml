services:
  # MongoDB база данных
  mongodb:
    image: mongo:7.0
    container_name: search_engine_mongodb
    restart: unless-stopped
    
    ports:
      - "27017:27017"
    
    environment:
      MONGO_INITDB_DATABASE: search_engine
    
    volumes:
      # Персистентное хранилище данных
      - mongodb_data:/data/db
      # Логи MongoDB
      - mongodb_logs:/var/log/mongodb
    
    networks:
      - search_network
    
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Mongo Express (опционально - веб-интерфейс для MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: search_engine_mongo_express
    restart: unless-stopped
    
    ports:
      - "8081:8081"
    
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    
    depends_on:
      - mongodb
    
    networks:
      - search_network

# Volumes для персистентности данных
volumes:
  mongodb_data:
    driver: local
  mongodb_logs:
    driver: local

# Сеть для взаимодействия контейнеров
networks:
  search_network:
    driver: bridge
